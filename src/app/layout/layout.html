<!-- A button rather than a #fragment link: with the router, a bare fragment
     would navigate away from the current page. -->
<button type="button" class="skip-link" (click)="skipToContent()">Skip to main content</button>

<div class="shell">
    @if (menuOpen()) {
        <div class="menu-backdrop" (click)="closeMenu()"></div>
    }

    <aside class="sidebar" id="app-sidebar" [class.open]="menuOpen()">
        <a class="brand" routerLink="/app/dashboard" aria-label="PRMS dashboard">
            <div class="logo" aria-hidden="true">R</div>
            <div>
                <div class="b-name">PRMS</div>
                <div class="b-sub">Rental Management</div>
            </div>
        </a>

        @for (group of nav(); track group.section) {
            <div class="nav-label">{{ group.section }}</div>
            <nav class="nav">
                @for (item of group.items; track item.route) {
                    <a [routerLink]="item.route" routerLinkActive="active" [attr.title]="item.label">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                            <path [attr.d]="item.icon" stroke-linecap="round" stroke-linejoin="round"></path>
                        </svg>
                        {{ item.label }}
                    </a>
                }
            </nav>
        }

        <div class="spacer"></div>

        <div class="userbox">
            <div class="avatar">{{ initials() }}</div>
            <div class="info">
                <div class="u-name">{{ user()?.name }}</div>
                <div class="u-role">{{ role().join(', ') }}</div>
            </div>
        </div>
    </aside>

    <div class="main" [attr.inert]="menuOpen() ? '' : null">
        <header class="topbar">
            <button
                #menuButton
                type="button"
                class="menu-btn"
                aria-label="Menu"
                aria-controls="app-sidebar"
                [attr.aria-expanded]="menuOpen()"
                (click)="openMenu()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
                    <path d="M4 7h16M4 12h16M4 17h16"></path>
                </svg>
            </button>
            <div class="t-spacer"></div>
            <app-notification-bell></app-notification-bell>
            <dx-button text="Logout" stylingMode="text" (onClick)="onLogout()"></dx-button>
        </header>
        <main class="content-area" id="main-content" tabindex="-1" #mainContent>
            <router-outlet></router-outlet>
        </main>
    </div>
</div>
