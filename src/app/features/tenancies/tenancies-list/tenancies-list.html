<div class="page">
    <div class="page-head">
        <h1>Tenancies</h1>
        <p>Manage rental agreements between tenants and units.</p>
    </div>

    <div class="grid-card">
        <dx-data-grid
            [dataSource]="dataSource"
            [showBorders]="false"
            [columnAutoWidth]="true"
            [hoverStateEnabled]="true">

            <dxo-search-panel
                [visible]="true"
                [width]="260"
                placeholder="Search tenancies...">
            </dxo-search-panel>

            <dxo-paging [pageSize]="10"></dxo-paging>

            <dxo-pager
                [visible]="true"
                [showInfo]="true"
                infoText="Showing {2} tenancies">
            </dxo-pager>

            <dxo-editing
                mode="popup"
                [allowAdding]="true"
                [allowUpdating]="true"
                [allowDeleting]="true"
                [useIcons]="true">

                <dxo-texts addRow="Add tenancy"></dxo-texts>

            </dxo-editing>

            <dxo-toolbar>
                <dxi-item
                    location="before"
                    template="titleTemplate">
                </dxi-item>

                <dxi-item
                    name="searchPanel"
                    location="after">
                </dxi-item>

                <dxi-item
                    name="addRowButton"
                    [showText]="'always'"
                    location="after">
                </dxi-item>
            </dxo-toolbar>

            <div
                *dxTemplate="let data of 'titleTemplate'"
                class="grid-title">
                All tenancies
            </div>

            <dxi-column
                dataField="unit_id"
                caption="Unit">

                <dxo-lookup
                    [dataSource]="unitsData"
                    valueExpr="id"
                    displayExpr="name">
                </dxo-lookup>

                <dxi-validation-rule type="required"></dxi-validation-rule>
            </dxi-column>

            <dxi-column
                dataField="tenant_id"
                caption="Tenant">

                <dxo-lookup
                    [dataSource]="tenantsData"
                    valueExpr="id"
                    [displayExpr]="tenantDisplay">
                </dxo-lookup>

                <dxi-validation-rule type="required"></dxi-validation-rule>
            </dxi-column>

            <dxi-column
                dataField="drafted_by_agent_id"
                caption="Agent">

                <dxo-lookup
                    [dataSource]="agentsData"
                    valueExpr="id"
                    [displayExpr]="agentDisplay">
                </dxo-lookup>

            </dxi-column>

            <dxi-column
                dataField="start_date"
                caption="Start Date"
                dataType="date">

                <dxi-validation-rule type="required"></dxi-validation-rule>

            </dxi-column>

            <dxi-column
                dataField="end_date"
                caption="End Date"
                dataType="date">
            </dxi-column>

            <dxi-column
                dataField="billing_cycle"
                caption="Billing Cycle">

                <dxo-lookup
                    [dataSource]="billingCycles">
                </dxo-lookup>

            </dxi-column>

            <dxi-column
                dataField="status"
                caption="Status"
                [allowEditing]="false">

                <dxo-lookup
                    [dataSource]="statuses">
                </dxo-lookup>

            </dxi-column>

        </dx-data-grid>
    </div>
</div>
