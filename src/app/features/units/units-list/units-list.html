<div class="page">
    <div class="page-head">
        <h1>Units</h1>
        <p>Manage the rental units available under each property.</p>
    </div>

    <div class="grid-card">
        <dx-data-grid
            [dataSource]="dataSource"
            [showBorders]="false"
            [columnAutoWidth]="true"
            [hoverStateEnabled]="true">

            <dxo-search-panel
                [visible]="true"
                [width]="260"
                placeholder="Search units...">
            </dxo-search-panel>

            <dxo-paging [pageSize]="10"></dxo-paging>

            <dxo-pager
                [visible]="true"
                [showInfo]="true"
                infoText="Showing {2} units">
            </dxo-pager>

            <dxo-editing
                mode="popup"
                [allowAdding]="true"
                [allowUpdating]="true"
                [allowDeleting]="true"
                [useIcons]="true">

                <dxo-texts addRow="Add unit"></dxo-texts>
            </dxo-editing>

            <dxo-toolbar>
                <dxi-item
                    location="before"
                    template="titleTemplate">
                </dxi-item>

                <dxi-item
                    name="searchPanel"
                    location="after">
                </dxi-item>

                <dxi-item
                    name="addRowButton"
                    [showText]="'always'"
                    location="after">
                </dxi-item>
            </dxo-toolbar>

            <div *dxTemplate="let data of 'titleTemplate'" class="grid-title">
                All units
            </div>

            <dxi-column dataField="property_id" caption="Property">
                <dxo-lookup
                    [dataSource]="propertiesData"
                    valueExpr="id"
                    displayExpr="name">
                </dxo-lookup>
                <dxi-validation-rule type="required"></dxi-validation-rule>
            </dxi-column>

            <dxi-column dataField="agent_id" caption="Agent">
                <dxo-lookup
                    [dataSource]="agentsData"
                    valueExpr="id"
                    [displayExpr]="agentDisplay">
                </dxo-lookup>
            </dxi-column>

            <dxi-column dataField="name" caption="Name">
                <dxi-validation-rule type="required"></dxi-validation-rule>
            </dxi-column>

            <dxi-column dataField="type" caption="Type">
                <dxi-validation-rule type="required"></dxi-validation-rule>
            </dxi-column>

            <dxi-column
                dataField="base_rent"
                caption="Base Rent"
                dataType="number">
                <dxi-validation-rule type="required"></dxi-validation-rule>
            </dxi-column>

            <dxi-column dataField="status" caption="Status">
                <dxo-lookup [dataSource]="statuses"></dxo-lookup>
            </dxi-column>

            <dxi-column
                dataField="description"
                caption="Description">
            </dxi-column>

        </dx-data-grid>
    </div>
</div>
