<div class="login-container">
    <div class="login-card">
        <a class="brand" routerLink="/">
            <div class="logo">R</div>
            <div>
                <div class="b-name">PRMS</div>
                <div class="b-sub">Rental Management</div>
            </div>
        </a>

        <h2>Sign in to your account</h2>

        <label>Email</label>
        <dx-text-box [(value)]="email" placeholder="you@example.com" mode="email"></dx-text-box>

        <label>Password</label>
        <dx-text-box [(value)]="password" placeholder="Your password" mode="password"></dx-text-box>

        @if (errorMessage()) {
            <p class="error" role="alert">{{ errorMessage() }}</p>
        }

        <dx-button
            text="Sign In"
            type="default"
            width="100%"
            [disabled]="loading()"
            (onClick)="onLogin()">
        </dx-button>

        <a class="back" routerLink="/">&larr; Back to PRMS</a>
    </div>
</div>
