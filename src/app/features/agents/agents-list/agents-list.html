<div class="page">
    <div class="page-head">
        <h1>Agents</h1>
        <p>Manage agents responsible for overseeing rental properties and units.</p>
    </div>

    <div class="grid-card">
        <dx-data-grid
            [dataSource]="dataSource"
            [showBorders]="false"
            [columnAutoWidth]="true"
            [hoverStateEnabled]="true">

            <dxo-search-panel
                [visible]="true"
                [width]="260"
                placeholder="Search agents...">
            </dxo-search-panel>

            <dxo-paging [pageSize]="10"></dxo-paging>

            <dxo-pager
                [visible]="true"
                [showInfo]="true"
                infoText="Showing {2} agents">
            </dxo-pager>

            <dxo-editing
                mode="popup"
                [allowAdding]="true"
                [allowUpdating]="true"
                [allowDeleting]="true"
                [useIcons]="true">

                <dxo-texts addRow="Add agent"></dxo-texts>
            </dxo-editing>

            <dxo-toolbar>
                <dxi-item
                    location="before"
                    template="titleTemplate">
                </dxi-item>

                <dxi-item
                    name="searchPanel"
                    location="after">
                </dxi-item>

                <dxi-item
                    name="addRowButton"
                    [showText]="'always'"
                    location="after">
                </dxi-item>
            </dxo-toolbar>

            <div *dxTemplate="let data of 'titleTemplate'" class="grid-title">
                All agents
            </div>

            <dxi-column dataField="fname" caption="First Name">
                <dxi-validation-rule type="required"></dxi-validation-rule>
            </dxi-column>

            <dxi-column dataField="lname" caption="Last Name">
                <dxi-validation-rule type="required"></dxi-validation-rule>
            </dxi-column>

            <dxi-column dataField="email" caption="Email">
                <dxi-validation-rule type="required"></dxi-validation-rule>
                <dxi-validation-rule type="email"></dxi-validation-rule>
            </dxi-column>

            <dxi-column dataField="phone" caption="Phone"></dxi-column>

            <dxi-column
                dataField="commission_rate"
                caption="Commission Rate (%)"
                dataType="number">
            </dxi-column>

        </dx-data-grid>
    </div>
</div>
